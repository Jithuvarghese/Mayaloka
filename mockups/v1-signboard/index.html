<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayaloka — Design Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>

  :root{
    --maroon:#A6392C;
    --maroon-dark:#7E2A20;
    --navy:#17384A;
    --navy-dark:#0F262F;
    --cream:#EFE3C7;
    --cream-light:#F8F1DE;
    --paper:#E7D9B8;
    --gold:#C08A34;
    --gold-soft:#D9B675;
    --ink:#241E19;
    --ink-soft:#5B5148;
    --radius:2px;
    --maxw:1240px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream-light);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--ink);
  }
  .label{
    font-family:'Special Elite',monospace;
    text-transform:uppercase;
    letter-spacing:0.16em;
    font-size:12px;
    color:var(--maroon);
  }
  .label.on-dark{color:var(--gold-soft);}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
  section{position:relative;}

  /* ---------- flourish divider ---------- */
  .flourish{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto;}
  .flourish .dash{width:34px;height:1px;background:currentColor;opacity:.55;}
  .flourish .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8;}
  .flourish.maroon{color:var(--maroon);}
  .flourish.gold{color:var(--gold-soft);}
</style>
</head>
<body>

</body>
</html>
